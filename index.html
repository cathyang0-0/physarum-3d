<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Physarum 3D — v0 (CPU reference)</title>
  <style>
    :root { --bar: 84px; --line: #e5e5e5; --soft: #f2f2f2; --mute: #999; }
    html, body { margin: 0; height: 100%; background: #fff; color: #000; overflow: hidden;
                 font: 11px/1.5 ui-monospace, Menlo, monospace; }
    #view { position: absolute; inset: var(--bar) 0 0 0; }
    #stats { position: absolute; left: 16px; top: calc(var(--bar) + 12px); white-space: pre; pointer-events: none; }
    #help { position: absolute; left: 16px; bottom: 14px; color: var(--mute); pointer-events: none; }

    /* ---- top toolbar ---- */
    #bar { position: absolute; top: 0; left: 0; right: 0; height: var(--bar); box-sizing: border-box;
           border-bottom: 1px solid var(--line); background: #fff; z-index: 10; }
    #bar .row { height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
                overflow-x: auto; white-space: nowrap; }
    #bar .row.top { justify-content: center; }
    #bar .seg.big button { height: 30px; padding: 0 22px; font-size: 12px; }
    #bar button, #bar select { font: inherit; color: #000; background: #fff; border: 1px solid #ccc;
           border-radius: 4px; height: 26px; padding: 0 10px; cursor: pointer; }
    #bar button:hover, #bar select:hover { background: var(--soft); }
    #bar .seg { display: inline-flex; }
    #bar .seg button { border-radius: 0; margin-left: -1px; }
    #bar .seg button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
    #bar .seg button:last-child { border-radius: 0 4px 4px 0; }
    #bar .seg button.on { background: #000; color: #fff; border-color: #000; }
    #bar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; flex: none; }
    #bar .grow { flex: 1; }
    #bar label { display: inline-flex; align-items: center; gap: 6px; color: #444; }
    #bar input[type=range] { width: 90px; accent-color: #000; }
    #bar #paramsBtn.on { background: #000; color: #fff; border-color: #000; }
    #bar #exampleSel { width: 130px; }

    /* ---- parameter sidebar (lil-gui), hidden until "Parameters" is pressed ---- */
    .lil-gui {
      --background-color: #fff; --text-color: #000; --title-background-color: #fff;
      --title-text-color: #000; --widget-color: #eee; --hover-color: #e2e2e2;
      --focus-color: #ddd; --number-color: #000; --string-color: #000;
      --font-family: ui-monospace, Menlo, monospace; --font-size: 11px;
    }
    .lil-gui.root { position: absolute; top: var(--bar); right: 0; max-height: calc(100% - var(--bar));
                    overflow-y: auto; border-left: 1px solid var(--line); z-index: 9; }
    .lil-gui.root.hidden { display: none; }
    .lil-gui .title { border-bottom: 1px solid #eee; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
  <header id="bar">
    <div class="row top">
      <div class="seg big" id="modeSeg" title="Loads the best setup for each mode">
        <button data-mode="2d">2D</button><button data-mode="3d">3D</button>
      </div>
    </div>
    <div class="row">
    <button id="playBtn">Pause</button>
    <button id="stepBtn">Step</button>
    <button id="resetBtn" title="Restart with the same seed and food">Reset</button>
    <span class="sep"></span>
    <button id="foodBtn">+ Random food</button>
    <button id="clearBtn">Clear food</button>
    <label id="planeCtl" title="Depth of the plane where clicks place food (3D)">plane z <input id="planeZ" type="range" min="0" max="63" step="1" /></label>
    <span class="sep"></span>
    <select id="exampleSel"></select>
    <span class="grow"></span>
    <button id="paramsBtn">Parameters</button>
    </div>
  </header>
  <div id="view"></div>
  <div id="stats"></div>
  <div id="help">click: add food · shift-click: remove food · drag: orbit · right-drag: pan · wheel: zoom<span id="help3d"> · shift+wheel or ↑/↓: move food plane</span></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
