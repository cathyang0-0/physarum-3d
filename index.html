<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Physarum 3D — v0 (CPU reference)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; color: #000; overflow: hidden;
                 font: 11px/1.5 ui-monospace, Menlo, monospace; }
    #view { position: absolute; inset: 0; }
    #stats { position: absolute; left: 16px; top: 14px; white-space: pre; pointer-events: none; }
    #help { position: absolute; left: 16px; bottom: 14px; color: #999; pointer-events: none; }
    /* lil-gui: plain white / black theme */
    .lil-gui {
      --background-color: #fff; --text-color: #000; --title-background-color: #fff;
      --title-text-color: #000; --widget-color: #eee; --hover-color: #e2e2e2;
      --focus-color: #ddd; --number-color: #000; --string-color: #000;
      --font-family: ui-monospace, Menlo, monospace; --font-size: 11px;
    }
    .lil-gui.root { border-left: 1px solid #e5e5e5; }
    .lil-gui .title { border-bottom: 1px solid #eee; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="view"></div>
  <div id="stats"></div>
  <div id="help">click: add food · shift-click: remove food · drag: orbit · right-drag: pan · wheel: zoom</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
