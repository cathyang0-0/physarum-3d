<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Physarum 3D — v0 (CPU reference)</title>
  <style>
    :root { --bottom: 52px; --line: #e5e5e5; --soft: #f2f2f2; --mute: #999; }
    html, body { margin: 0; height: 100%; background: #fff; color: #000; overflow: hidden;
                 font: 11px/1.5 ui-monospace, Menlo, monospace; }
    #view { position: absolute; inset: 0; }
    #stats { position: absolute; left: 16px; top: 14px; white-space: pre; pointer-events: none; }
    #help { position: absolute; left: 16px; bottom: calc(var(--bottom) + 6px); color: var(--mute); pointer-events: none; }

    button, select { font: inherit; color: #000; background: #fff; border: 1px solid #ccc;
                     border-radius: 4px; height: 28px; padding: 0 10px; cursor: pointer; }
    button:hover, select:hover { background: var(--soft); }

    /* ---- 2D / 3D toggle, floating at the top centre ---- */
    #modeSeg { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: inline-flex; z-index: 10; }
    #modeSeg button { height: 32px; padding: 0 24px; font-size: 12px; border-radius: 0; margin-left: -1px; }
    #modeSeg button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
    #modeSeg button:last-child { border-radius: 0 4px 4px 0; }
    #modeSeg button.on { background: #000; color: #fff; border-color: #000; }

    /* ---- "shuffle food": the main action, on its own at the top right ---- */
    #shuffleBtn { position: absolute; top: 12px; right: 16px; z-index: 10; height: 32px; padding: 0 16px;
                  display: inline-flex; align-items: center; gap: 8px; font-size: 12px;
                  background: #000; color: #fff; border-color: #000; }
    #shuffleBtn:hover { background: #333; }
    #shuffleBtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6;
                      stroke-linecap: round; stroke-linejoin: round; }

    /* ---- habitable shape, vertical icon bar on the left ---- */
    #domainBar { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); z-index: 10;
                 display: flex; flex-direction: column; gap: 6px; }
    #domainBar button { width: 40px; height: 40px; padding: 0; display: grid; place-items: center; }
    #domainBar button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.4;
                            stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
    #domainBar button.on { background: #000; color: #fff; border-color: #000; }

    /* ---- controls along the bottom ---- */
    #controls { position: absolute; left: 0; right: 0; bottom: 0; height: var(--bottom); box-sizing: border-box;
                display: flex; align-items: center; gap: 8px; padding: 0 16px; z-index: 10;
                overflow-x: auto; white-space: nowrap; }
    #controls .gap { width: 12px; flex: none; }
    #controls .grow { flex: 1; }
    #controls label { display: inline-flex; align-items: center; gap: 6px; color: #444; }
    #controls input[type=range] { width: 90px; accent-color: #000; }
    #controls #exampleSel { width: 140px; }
    #paramsBtn.on { background: #000; color: #fff; border-color: #000; }

    /* ---- parameter sidebar (lil-gui), hidden until "Parameters" is pressed ---- */
    .lil-gui {
      --background-color: #fff; --text-color: #000; --title-background-color: #fff;
      --title-text-color: #000; --widget-color: #eee; --hover-color: #e2e2e2;
      --focus-color: #ddd; --number-color: #000; --string-color: #000;
      --font-family: ui-monospace, Menlo, monospace; --font-size: 11px;
    }
    .lil-gui.root { position: absolute; top: 0; right: 0; max-height: calc(100% - var(--bottom));
                    overflow-y: auto; border-left: 1px solid var(--line); z-index: 9; }
    .lil-gui.root.hidden { display: none; }
    .lil-gui .title { border-bottom: 1px solid #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lil-gui .controller .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="modeSeg" title="Loads the best setup for each mode">
    <button data-mode="2d">2D</button><button data-mode="3d">3D</button>
  </div>
  <div id="view"></div>
  <div id="stats"></div>
  <div id="help">click: add food · shift-click: remove food · <span id="helpDrag"></span> · wheel: zoom<span id="help3d"> · shift+wheel or ↑/↓: move food plane</span></div>
  <button id="shuffleBtn" title="Clear the food, place the same number at new random positions, and restart">
    <svg viewBox="0 0 24 24"><path d="M16 3h5v5 M4 20 21 3 M21 16v5h-5 M15 15l6 6 M4 4l5 5"/></svg>
    Shuffle food
  </button>
  <div id="domainBar" title="Shape the slime mold grows in">
    <button data-domain="box" title="Box"><svg viewBox="0 0 24 24"><path d="M12 3 20 7.5v9L12 21 4 16.5v-9Z M4 7.5 12 12l8-4.5 M12 12v9"/></svg></button>
    <button data-domain="sphere" title="Sphere"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><ellipse cx="12" cy="12" rx="8.5" ry="3"/></svg></button>
    <button data-domain="pyramid" title="Pyramid"><svg viewBox="0 0 24 24"><path d="M12 3 3.5 17 12 21l8.5-4Z M12 3v18"/></svg></button>
    <button data-domain="cone" title="Cone"><svg viewBox="0 0 24 24"><path d="M12 3 4 17.5 M12 3l8 14.5"/><ellipse cx="12" cy="17.5" rx="8" ry="3"/></svg></button>
    <button data-domain="torus" title="Torus"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="5.5"/><path d="M8 11.5c2.5 2 5.5 2 8 0 M9.2 12.6c1.8-1.3 3.8-1.3 5.6 0"/></svg></button>
    <button data-domain="gyroid" title="Gyroid (labyrinth)"><svg viewBox="0 0 24 24"><path d="M3 7c3-4 6 4 9 0s6 4 9 0 M3 12c3-4 6 4 9 0s6 4 9 0 M3 17c3-4 6 4 9 0s6 4 9 0"/></svg></button>
  </div>
  <div id="controls">
    <button id="playBtn">Pause</button>
    <button id="stepBtn">Step</button>
    <button id="resetBtn" title="Restart with the same seed and food">Reset</button>
    <span class="gap"></span>
    <button id="foodBtn">+ Random food</button>
    <button id="clearBtn">Clear food</button>
    <label id="planeCtl" title="Depth of the plane where clicks place food (3D)">plane z <input id="planeZ" type="range" min="0" max="63" step="1" /></label>
    <span class="gap"></span>
    <select id="exampleSel"></select>
    <span class="grow"></span>
    <button id="paramsBtn">Parameters</button>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
